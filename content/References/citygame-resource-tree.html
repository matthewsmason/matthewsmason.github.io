<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resource Combination Tree</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600;700&display=swap');

  :root {
    --bg:   #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --t0:  #58a6ff;
    --t1:  #3fb950;
    --t2:  #c9a227;
    --t3:  #f78166;
    --t4:  #bc8cff;
    --t5:  #ff6eb4;
    --t6:  #00e5ff;
    --t7:  #ffe066;
    --t8:  #ff9f43;
    --t9:  #7bed9f;
    --t10: #e0e0e0;
    --te:  #ffa657;
    --text: #e6edf3;
    --muted: #8b949e;
    --incoming: #4ade80;
    --outgoing: #fb923c;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
  }

  header {
    padding: 18px 28px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 24px;
    position: sticky; top: 0;
    background: var(--bg);
    z-index: 50;
    flex-wrap: wrap;
  }

  header h1 {
    font-family: 'Share Tech Mono', monospace;
    font-size: 15px;
    color: var(--text);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .line-legend { display: flex; gap: 18px; align-items: center; }

  .line-legend-item {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
  }

  .line-swatch { width: 28px; height: 2px; position: relative; }
  .line-swatch::after {
    content: '▶'; position: absolute;
    right: -4px; top: 50%; transform: translateY(-50%); font-size: 8px;
  }
  .swatch-in  { background: var(--incoming); }
  .swatch-in::after  { color: var(--incoming); }
  .swatch-out { background: var(--outgoing); }
  .swatch-out::after { color: var(--outgoing); }

  .legend {
    display: flex; gap: 14px; padding: 9px 28px;
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
    position: sticky; top: 55px; background: var(--bg); z-index: 50;
  }

  .legend-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 10px; color: var(--muted);
    font-family: 'Share Tech Mono', monospace; white-space: nowrap;
  }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .tree-wrap { position: relative; }

  #line-canvas {
    position: absolute; top: 0; left: 0;
    pointer-events: none; z-index: 1;
  }

  .tier-row {
    display: flex; align-items: flex-start;
    padding: 18px 28px; border-bottom: 1px solid var(--border);
    position: relative; z-index: 2;
  }

  .tier-label { width: 90px; flex-shrink: 0; padding-top: 8px; }
  .tier-label .tier-name {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
  }
  .tier-label .tier-sub { font-size: 9px; color: var(--muted); margin-top: 3px; line-height: 1.5; }

  .nodes { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }

  .node {
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer; transition: transform 0.15s ease;
  }
  .node:hover { transform: translateY(-2px); }

  .node-card {
    padding: 5px 11px; border-radius: 5px; border: 1px solid;
    font-size: 11px; font-weight: 600; letter-spacing: 0.2px;
    white-space: nowrap; text-align: center; line-height: 1.4;
    transition: box-shadow 0.2s ease, opacity 0.2s ease;
  }

  .node.dimmed .node-card   { opacity: 0.1; }
  .node.dimmed .node-recipe { opacity: 0.07; }
  .node.highlighted .node-card { box-shadow: 0 0 12px currentColor; }

  .node-recipe {
    font-size: 9px; color: var(--muted); margin-top: 4px;
    font-family: 'Share Tech Mono', monospace;
    text-align: center; max-width: 135px; line-height: 1.35; transition: opacity 0.2s;
  }

  .t0  .node-card { color: var(--t0);  border-color: var(--t0);  background: rgba(88,166,255,0.07); }
  .t1  .node-card { color: var(--t1);  border-color: var(--t1);  background: rgba(63,185,80,0.07); }
  .t2  .node-card { color: var(--t2);  border-color: var(--t2);  background: rgba(201,162,39,0.07); }
  .t3  .node-card { color: var(--t3);  border-color: var(--t3);  background: rgba(247,129,102,0.07); }
  .t4  .node-card { color: var(--t4);  border-color: var(--t4);  background: rgba(188,140,255,0.07); }
  .t5  .node-card { color: var(--t5);  border-color: var(--t5);  background: rgba(255,110,180,0.07); }
  .t6  .node-card { color: var(--t6);  border-color: var(--t6);  background: rgba(0,229,255,0.07); }
  .t7  .node-card { color: var(--t7);  border-color: var(--t7);  background: rgba(255,224,102,0.07); }
  .t8  .node-card { color: var(--t8);  border-color: var(--t8);  background: rgba(255,159,67,0.07); }
  .t9  .node-card { color: var(--t9);  border-color: var(--t9);  background: rgba(123,237,159,0.07); }
  .t10 .node-card { color: var(--t10); border-color: var(--t10); background: rgba(224,224,224,0.07); }
  .te  .node-card { color: var(--te);  border-color: var(--te);  background: rgba(255,166,87,0.1); }

  .tier-label.t0  .tier-name { color: var(--t0); }
  .tier-label.t1  .tier-name { color: var(--t1); }
  .tier-label.t2  .tier-name { color: var(--t2); }
  .tier-label.t3  .tier-name { color: var(--t3); }
  .tier-label.t4  .tier-name { color: var(--t4); }
  .tier-label.t5  .tier-name { color: var(--t5); }
  .tier-label.t6  .tier-name { color: var(--t6); }
  .tier-label.t7  .tier-name { color: var(--t7); }
  .tier-label.t8  .tier-name { color: var(--t8); }
  .tier-label.t9  .tier-name { color: var(--t9); }
  .tier-label.t10 .tier-name { color: var(--t10); }
  .tier-label.te  .tier-name { color: var(--te); }

  .tooltip {
    position: fixed; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 11px 15px; font-size: 12px; max-width: 290px;
    pointer-events: none; opacity: 0; transition: opacity 0.15s;
    z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,0.55);
  }
  .tooltip.visible { opacity: 1; }
  .tooltip-name   { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  .tooltip-recipe { color: var(--muted); font-family: 'Share Tech Mono', monospace; font-size: 10px; margin-bottom: 7px; line-height: 1.5; }
  .tooltip-uses   { font-size: 11px; color: var(--text); line-height: 1.7; }
  .tooltip-uses span { color: var(--muted); display: block; margin-bottom: 2px; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; }
</style>
</head>
<body>

<header>
  <h1>Combination Tree</h1>
  <div class="line-legend">
    <div class="line-legend-item"><div class="line-swatch swatch-in"></div>ingredient of this</div>
    <div class="line-legend-item"><div class="line-swatch swatch-out"></div>used in recipe for</div>
  </div>
</header>

<div class="legend">

  <div class="legend-item"><div class="legend-dot" style="background:var(--t4)"></div>T4 Processed</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--t5)"></div>T5 Components</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--t6)"></div>T6 Advanced</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--t7)"></div>T7 Precision</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--t8)"></div>T8 High-Tech</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--t9)"></div>T9 Cutting Edge</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--t10)"></div>T10 Pinnacle</div>
</div>

<div class="tree-wrap" id="tree-wrap">
  <canvas id="line-canvas"></canvas>
  <div id="tree"></div>
</div>

<div class="tooltip" id="tooltip"></div>

const tierDef = [
  { id:'t0',  label:'Tier 0',  sub:'World\nResources' },
  { id:'te',  label:'Energy',  sub:'Player\'s\nchoice' },
  { id:'t1',  label:'Tier 1',  sub:'Basic\nProcessed' },
  { id:'t2',  label:'Tier 2',  sub:'Industrial' },
  { id:'t3',  label:'Tier 3',  sub:'Refined' },
  { id:'t4',  label:'Tier 4',  sub:'Processed\nGoods' },
  { id:'t5',  label:'Tier 5',  sub:'Components' },
  { id:'t6',  label:'Tier 6',  sub:'Advanced\nMaterials' },
  { id:'t7',  label:'Tier 7',  sub:'Precision\nGoods' },
  { id:'t8',  label:'Tier 8',  sub:'High-Tech' },
  { id:'t9',  label:'Tier 9',  sub:'Cutting\nEdge' },
  { id:'t10', label:'Tier 10', sub:'Pinnacle\nMaterials' },
];

const nodeMap = {};
nodes.forEach(n => nodeMap[n.id] = n);
const downstream = {};
nodes.forEach(n => downstream[n.id] = []);
nodes.forEach(n => n.inputs.forEach(inp => { if (downstream[inp]) downstream[inp].push(n.id); }));

const treeEl = document.getElementById('tree');
const elMap = {};

tierDef.forEach(tier => {
  const tierNodes = nodes.filter(n => n.tier === tier.id);
  if (!tierNodes.length) return;
  const row = document.createElement('div');
  row.className = 'tier-row';
  const label = document.createElement('div');
  label.className = `tier-label ${tier.id}`;
  label.innerHTML = `<div class="tier-name">${tier.label}</div><div class="tier-sub">${tier.sub.replace('\n','<br>')}</div>`;
  row.appendChild(label);
  const nodesEl = document.createElement('div');
  nodesEl.className = 'nodes';
  tierNodes.forEach(node => {
    const el = document.createElement('div');
    el.className = `node ${node.tier}`;
    el.dataset.id = node.id;
    const card = document.createElement('div');
    card.className = 'node-card';
    card.textContent = node.name;
    const recipe = document.createElement('div');
    recipe.className = 'node-recipe';
    recipe.textContent = node.recipe;
    el.appendChild(card);
    el.appendChild(recipe);
    nodesEl.appendChild(el);
    elMap[node.id] = el;
  });
  row.appendChild(nodesEl);
  treeEl.appendChild(row);
});

const canvas = document.getElementById('line-canvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('tree-wrap');

function resizeCanvas() {
  canvas.width  = wrap.scrollWidth;
  canvas.height = wrap.scrollHeight;
  canvas.style.width  = wrap.scrollWidth  + 'px';
  canvas.style.height = wrap.scrollHeight + 'px';
}

// Returns the rect of the card in canvas-space (accounting for scroll)
function getCardRect(el) {
  const card = el.querySelector('.node-card');
  const wrapRect = wrap.getBoundingClientRect();
  const r = card.getBoundingClientRect();
  const st = window.scrollY;
  const wrapTop = wrapRect.top + st;
  return {
    left:   r.left   - wrapRect.left,
    right:  r.right  - wrapRect.left,
    top:    r.top    + st - wrapTop,
    bottom: r.bottom + st - wrapTop,
    cx:     r.left   - wrapRect.left + r.width  / 2,
    cy:     r.top    + st - wrapTop  + r.height / 2,
    w:      r.width,
    h:      r.height,
  };
}

// Choose best exit/entry points based on relative position of the two cards.
// Returns { from: {x,y}, to: {x,y}, cpFrom: {x,y}, cpTo: {x,y} }
function getConnectionPoints(fromRect, toRect) {
  const dx = toRect.cx - fromRect.cx;
  const dy = toRect.cy - fromRect.cy;
  const adx = Math.abs(dx);
  const ady = Math.abs(dy);

  // Threshold: if horizontal distance dominates significantly over vertical,
  // use left/right edges; otherwise use top/bottom edges.
  // We use a ratio: if adx/ady > 1.2 AND vertical overlap exists, go sideways.
  const sameRow = ady < (fromRect.h * 1.5);
  const dominantlyHorizontal = adx > ady * 1.2;

  let from, to, cpFrom, cpTo;

  if (sameRow && dominantlyHorizontal) {
    // Horizontal connection: right→left or left→right
    if (dx > 0) {
      from   = { x: fromRect.right, y: fromRect.cy };
      to     = { x: toRect.left,    y: toRect.cy   };
    } else {
      from   = { x: fromRect.left,  y: fromRect.cy };
      to     = { x: toRect.right,   y: toRect.cy   };
    }
    const offset = Math.abs(dx) * 0.4;
    cpFrom = { x: from.x + (dx > 0 ? offset : -offset), y: from.y };
    cpTo   = { x: to.x   - (dx > 0 ? offset : -offset), y: to.y   };
  } else {
    // Vertical connection: bottom→top or top→bottom
    if (dy > 0) {
      from   = { x: fromRect.cx, y: fromRect.bottom };
      to     = { x: toRect.cx,   y: toRect.top      };
    } else {
      from   = { x: fromRect.cx, y: fromRect.top    };
      to     = { x: toRect.cx,   y: toRect.bottom   };
    }
    const offset = Math.abs(dy) * 0.45;
    cpFrom = { x: from.x + dx * 0.1, y: from.y + (dy > 0 ?  offset : -offset) };
    cpTo   = { x: to.x   - dx * 0.1, y: to.y   - (dy > 0 ?  offset : -offset) };
  }

  return { from, to, cpFrom, cpTo, dx, dy, sameRow, dominantlyHorizontal };
}

function drawArrowhead(x, y, dx, dy, color) {
  const len = Math.sqrt(dx*dx + dy*dy);
  if (len === 0) return;
  const ux = dx / len, uy = dy / len;
  const size = 6;
  const px = -uy, py = ux;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - ux * size + px * size * 0.55, y - uy * size + py * size * 0.55);
  ctx.lineTo(x - ux * size - px * size * 0.55, y - uy * size - py * size * 0.55);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.9;
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawConnector(fromEl, toEl, color) {
  const fromRect = getCardRect(fromEl);
  const toRect   = getCardRect(toEl);
  const { from, to, cpFrom, cpTo, dx, dy } = getConnectionPoints(fromRect, toRect);

  ctx.beginPath();
  ctx.moveTo(from.x, from.y);
  ctx.bezierCurveTo(cpFrom.x, cpFrom.y, cpTo.x, cpTo.y, to.x, to.y);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.globalAlpha = 0.45;
  ctx.setLineDash([5, 4]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;

  // Arrowhead direction is the tangent at the destination end
  // Approximate: direction from cpTo → to
  const arrowDx = to.x - cpTo.x;
  const arrowDy = to.y - cpTo.y;
  drawArrowhead(to.x, to.y, arrowDx, arrowDy, color);
}

function drawLines(activeId) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!activeId) return;

  const node     = nodeMap[activeId];
  const activeEl = elMap[activeId];
  if (!activeEl) return;

  // Incoming: ingredient → active (green)
  node.inputs.forEach(inp => {
    const el = elMap[inp];
    if (!el) return;
    drawConnector(el, activeEl, INCOMING_COLOR);
  });

  // Outgoing: active → downstream (orange)
  downstream[activeId].forEach(did => {
    const el = elMap[did];
    if (!el) return;
    drawConnector(activeEl, el, OUTGOING_COLOR);
  });
}

const tooltip = document.getElementById('tooltip');

function setHighlight(activeId) {
  if (!activeId) {
    Object.values(elMap).forEach(el => el.classList.remove('dimmed','highlighted'));
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    tooltip.classList.remove('visible');
    return;
  }
  const node    = nodeMap[activeId];
  const related = new Set([...node.inputs, ...downstream[activeId]]);
  Object.keys(elMap).forEach(id => {
    const el = elMap[id];
    if (id === activeId || related.has(id)) {
      el.classList.remove('dimmed'); el.classList.add('highlighted');
    } else {
      el.classList.add('dimmed'); el.classList.remove('highlighted');
    }
  });
  drawLines(activeId);
}

Object.keys(elMap).forEach(id => {
  const el   = elMap[id];
  const node = nodeMap[id];
  el.addEventListener('mouseenter', () => {
    resizeCanvas();
    setHighlight(id);
    tooltip.innerHTML = `
      <div class="tooltip-name">${node.name}</div>
      <div class="tooltip-recipe">= ${node.recipe}</div>
      <div class="tooltip-uses"><span>Unlocks / Used In</span>${node.uses.map(u => `• ${u}`).join('<br>')}</div>`;
    tooltip.classList.add('visible');
  });
  el.addEventListener('mousemove', e => {
    tooltip.style.left = Math.min(e.clientX + 16, window.innerWidth  - 310) + 'px';
    tooltip.style.top  = Math.min(e.clientY - 10, window.innerHeight - 210) + 'px';
  });
  el.addEventListener('mouseleave', () => { setHighlight(null); });
});

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
