<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resource Combination Tree — 10 Tiers</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600;700&display=swap');

  :root {
    --bg:   #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --t0:  #58a6ff;
    --t1:  #3fb950;
    --t2:  #c9a227;
    --t3:  #f78166;
    --t4:  #bc8cff;
    --t5:  #ff6eb4;
    --t6:  #00e5ff;
    --t7:  #ffe066;
    --t8:  #ff9f43;
    --t9:  #7bed9f;
    --t10: #e0e0e0;
    --te:  #ffa657;
    --text: #e6edf3;
    --muted: #8b949e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
  }

  header {
    padding: 18px 28px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 16px;
    position: sticky; top: 0;
    background: var(--bg);
    z-index: 50;
  }

  header h1 {
    font-family: 'Share Tech Mono', monospace;
    font-size: 15px;
    color: var(--text);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  header p { font-size: 12px; color: var(--muted); }

  .legend {
    display: flex;
    gap: 14px;
    padding: 9px 28px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    position: sticky; top: 49px;
    background: var(--bg);
    z-index: 50;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
    white-space: nowrap;
  }

  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .tree-wrap { position: relative; }

  #line-canvas {
    position: absolute; top: 0; left: 0;
    pointer-events: none;
    z-index: 1;
  }

  .tier-row {
    display: flex;
    align-items: flex-start;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 2;
  }

  .tier-label {
    width: 90px;
    flex-shrink: 0;
    padding-top: 8px;
  }

  .tier-label .tier-name {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .tier-label .tier-sub {
    font-size: 9px;
    color: var(--muted);
    margin-top: 3px;
    line-height: 1.5;
  }

  .nodes {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    flex: 1;
  }

  .node {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  .node:hover { transform: translateY(-2px); }

  .node-card {
    padding: 5px 11px;
    border-radius: 5px;
    border: 1px solid;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2px;
    white-space: nowrap;
    transition: box-shadow 0.2s ease, opacity 0.2s ease;
    text-align: center;
    line-height: 1.4;
  }

  .node.dimmed .node-card   { opacity: 0.1; }
  .node.dimmed .node-recipe { opacity: 0.07; }
  .node.highlighted .node-card { box-shadow: 0 0 12px currentColor; }

  .node-recipe {
    font-size: 9px;
    color: var(--muted);
    margin-top: 4px;
    font-family: 'Share Tech Mono', monospace;
    text-align: center;
    max-width: 130px;
    line-height: 1.35;
    transition: opacity 0.2s;
  }

  /* tier color bindings */
  .t0  .node-card { color: var(--t0);  border-color: var(--t0);  background: rgba(88,166,255,0.07); }
  .t1  .node-card { color: var(--t1);  border-color: var(--t1);  background: rgba(63,185,80,0.07); }
  .t2  .node-card { color: var(--t2);  border-color: var(--t2);  background: rgba(201,162,39,0.07); }
  .t3  .node-card { color: var(--t3);  border-color: var(--t3);  background: rgba(247,129,102,0.07); }
  .t4  .node-card { color: var(--t4);  border-color: var(--t4);  background: rgba(188,140,255,0.07); }
  .t5  .node-card { color: var(--t5);  border-color: var(--t5);  background: rgba(255,110,180,0.07); }
  .t6  .node-card { color: var(--t6);  border-color: var(--t6);  background: rgba(0,229,255,0.07); }
  .t7  .node-card { color: var(--t7);  border-color: var(--t7);  background: rgba(255,224,102,0.07); }
  .t8  .node-card { color: var(--t8);  border-color: var(--t8);  background: rgba(255,159,67,0.07); }
  .t9  .node-card { color: var(--t9);  border-color: var(--t9);  background: rgba(123,237,159,0.07); }
  .t10 .node-card { color: var(--t10); border-color: var(--t10); background: rgba(224,224,224,0.07); }
  .te  .node-card { color: var(--te);  border-color: var(--te);  background: rgba(255,166,87,0.07); }

  .tier-label.t0  .tier-name { color: var(--t0); }
  .tier-label.t1  .tier-name { color: var(--t1); }
  .tier-label.t2  .tier-name { color: var(--t2); }
  .tier-label.t3  .tier-name { color: var(--t3); }
  .tier-label.t4  .tier-name { color: var(--t4); }
  .tier-label.t5  .tier-name { color: var(--t5); }
  .tier-label.t6  .tier-name { color: var(--t6); }
  .tier-label.t7  .tier-name { color: var(--t7); }
  .tier-label.t8  .tier-name { color: var(--t8); }
  .tier-label.t9  .tier-name { color: var(--t9); }
  .tier-label.t10 .tier-name { color: var(--t10); }
  .tier-label.te  .tier-name { color: var(--te); }

  .tooltip {
    position: fixed;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 15px;
    font-size: 12px;
    max-width: 280px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 200;
    box-shadow: 0 8px 24px rgba(0,0,0,0.55);
  }

  .tooltip.visible { opacity: 1; }
  .tooltip-name   { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  .tooltip-recipe { color: var(--muted); font-family: 'Share Tech Mono', monospace; font-size: 10px; margin-bottom: 7px; line-height: 1.5; }
  .tooltip-uses   { font-size: 11px; color: var(--text); line-height: 1.7; }
  .tooltip-uses span { color: var(--muted); display: block; margin-bottom: 2px; font-size: 9px; text-transform: uppercase; letter-spacing: 1px; }
</style>
</head>
<body>

<header>
  <h1>Combination Tree</h1>
  <p>Hover any node to trace its connections</p>
</header>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--t0)"></div>Tier 0 — World</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--te)"></div>Energy</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--t1)"></div>T1 Basic</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--t2)"></div>T2 Industrial</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--t3)"></div>T3 Manufacturing</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--t4)"></div>T4 Engineering</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--t5)"></div>T5 Electronics</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--t6)"></div>T6 Advanced Tech</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--t7)"></div>T7 Smart Systems</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--t8)"></div>T8 Urban Scale</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--t9)"></div>T9 Megacity</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--t10)"></div>T10 Pinnacle</div>
</div>

<div class="tree-wrap" id="tree-wrap">
  <canvas id="line-canvas"></canvas>
  <div id="tree"></div>
</div>

<div class="tooltip" id="tooltip"></div>

];

const nodeMap = {};
nodes.forEach(n => nodeMap[n.id] = n);
const downstream = {};
nodes.forEach(n => downstream[n.id] = []);
nodes.forEach(n => n.inputs.forEach(inp => { if (downstream[inp]) downstream[inp].push(n.id); }));

// Render
const treeEl = document.getElementById('tree');
const elMap = {};

tierDef.forEach(tier => {
  const tierNodes = nodes.filter(n => n.tier === tier.id);
  if (!tierNodes.length) return;

  const row = document.createElement('div');
  row.className = 'tier-row';

  const label = document.createElement('div');
  label.className = `tier-label ${tier.id}`;
  label.innerHTML = `<div class="tier-name">${tier.label}</div><div class="tier-sub">${tier.sub.replace('\n','<br>')}</div>`;
  row.appendChild(label);

  const nodesEl = document.createElement('div');
  nodesEl.className = 'nodes';

  tierNodes.forEach(node => {
    const el = document.createElement('div');
    el.className = `node ${node.tier}`;
    el.dataset.id = node.id;

    const card = document.createElement('div');
    card.className = 'node-card';
    card.textContent = node.name;

    const recipe = document.createElement('div');
    recipe.className = 'node-recipe';
    recipe.textContent = node.recipe;

    el.appendChild(card);
    el.appendChild(recipe);
    nodesEl.appendChild(el);
    elMap[node.id] = el;
  });

  row.appendChild(nodesEl);
  treeEl.appendChild(row);
});

// Canvas
const canvas = document.getElementById('line-canvas');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('tree-wrap');

function resizeCanvas() {
  canvas.width  = wrap.scrollWidth;
  canvas.height = wrap.scrollHeight;
  canvas.style.width  = wrap.scrollWidth  + 'px';
  canvas.style.height = wrap.scrollHeight + 'px';
}

function getCenter(el) {
  const card = el.querySelector('.node-card');
  const wrapRect = wrap.getBoundingClientRect();
  const r = card.getBoundingClientRect();
  const scrollTop = window.scrollY;
  return {
    x: r.left - wrapRect.left + r.width / 2,
    y: r.top + scrollTop - (wrapRect.top + scrollTop) + r.height / 2
  };
}

function drawLines(activeId, relatedIds, color) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!activeId) return;
  const from = getCenter(elMap[activeId]);

  ctx.beginPath();
  ctx.arc(from.x, from.y, 5, 0, Math.PI*2);
  ctx.fillStyle = color; ctx.globalAlpha = 0.9; ctx.fill(); ctx.globalAlpha = 1;

  relatedIds.forEach(rid => {
    if (!elMap[rid]) return;
    const to = getCenter(elMap[rid]);
    const dy = to.y - from.y;
    const dx = to.x - from.x;
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.bezierCurveTo(from.x + dx*0.1, from.y + dy*0.5, to.x - dx*0.1, to.y - dy*0.5, to.x, to.y);
    ctx.strokeStyle = color; ctx.lineWidth = 1.5;
    ctx.globalAlpha = 0.4; ctx.setLineDash([5,4]); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(to.x, to.y, 3, 0, Math.PI*2);
    ctx.fillStyle = color; ctx.globalAlpha = 0.75; ctx.fill(); ctx.globalAlpha = 1;
  });
}

const tooltip = document.getElementById('tooltip');

function setHighlight(activeId) {
  if (!activeId) {
    Object.values(elMap).forEach(el => el.classList.remove('dimmed','highlighted'));
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    tooltip.classList.remove('visible');
    return;
  }
  const node = nodeMap[activeId];
  const related = new Set([...node.inputs, ...downstream[activeId]]);
  Object.keys(elMap).forEach(id => {
    const el = elMap[id];
    if (id === activeId || related.has(id)) {
      el.classList.remove('dimmed'); el.classList.add('highlighted');
    } else {
      el.classList.add('dimmed'); el.classList.remove('highlighted');
    }
  });
  drawLines(activeId, [...related], TC[node.tier] || '#fff');
}

Object.keys(elMap).forEach(id => {
  const el = elMap[id];
  const node = nodeMap[id];
  el.addEventListener('mouseenter', () => {
    resizeCanvas(); setHighlight(id);
    tooltip.innerHTML = `
      <div class="tooltip-name">${node.name}</div>
      <div class="tooltip-recipe">= ${node.recipe}</div>
      <div class="tooltip-uses"><span>Unlocks / Used In</span>${node.uses.map(u=>`• ${u}`).join('<br>')}</div>`;
    tooltip.classList.add('visible');
  });
  el.addEventListener('mousemove', e => {
    tooltip.style.left = Math.min(e.clientX+16, window.innerWidth-300)+'px';
    tooltip.style.top  = Math.min(e.clientY-10,  window.innerHeight-200)+'px';
  });
  el.addEventListener('mouseleave', () => { setHighlight(null); });
});

window.addEventListener('resize', resizeCanvas);
resizeCanvas();
